# === Nav2 (Jazzy): goal-directed missions of the wheeled baseline ===
# Adapted from the Nav2 parameter files (github.com/ros-navigation/navigation2, nav2_bringup: Apache-2.0; the amcl section, nav2_amcl: LGPL-2.1-or-later), under those licenses.
# Wall-clock stack (use_sim_time: false everywhere, consistent with scan/odom publishers).
# Robot: diff drive, body 0.42 m (radius 0.21) + slack -> robot_radius 0.22.
# Anchor doors 0.90-0.95: inflation 0.45 leaves a costed corridor (not lethal).
# Initial pose KNOWN: spawn (0,0,yaw 0) in every world -> set_initial_pose: true.
# aerial-explore-bench copy: the wheeled baseline's v9 (the predecessor's published Nav2
# configuration) verbatim except the corrections marked below: AMCL's motion model, the velocity
# smoother's reverse, and the controller's and the behaviors' transform tolerance.
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan
    laser_max_range: 12.0
    laser_min_range: 0.15
    max_beams: 120
    min_particles: 300
    max_particles: 1500
    alpha1: 0.15
    alpha2: 0.15
    alpha3: 0.15
    alpha4: 0.15
    update_min_d: 0.15
    update_min_a: 0.15
    resample_interval: 1
    transform_tolerance: 0.5
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    always_reset_initial_pose: true
    tf_broadcast: true
    # aerial-explore-bench correction (a deviation from the baseline's v9): the omnidirectional
    # motion model, as the aerial arm's AMCL (policies/nav2/amcl_aerial.yaml). base_link is the
    # lidar at the chassis centre, 0.10 m ahead of the wheel axle the robot turns about
    # (sim/wheeled/payloads/base.usda); a turn in place moves it ~1.5 cm sideways per AMCL
    # update, which DifferentialMotionModel reads as a 90-degree bearing and answers with
    # sigma 0.82 m / 33 deg of noise per update (0.06 m here) - AMCL left the true pose by
    # metres in 25 of the first 26 batch tours while the raw odometry stayed within 0.5 m.
    robot_model_type: nav2_amcl::OmniMotionModel
    alpha5: 0.15            # omni model only (lateral translation noise), at the alphas' level

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 3.0   # v7: DWB tolerance for momentary dead-ends (narrows/pockets)
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.25
      movement_time_allowance: 90.0   # RTF~0.5 + walkers that block: patience ~45 sim-s
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 6.28
      stateful: true
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      min_vel_x: -0.08   # v8: gentle reverse; without it, it never unstuck from door mouths
      max_vel_x: 0.30
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 1.2
      min_speed_xy: 0.0
      max_speed_xy: 0.30
      min_speed_theta: 0.0
      acc_lim_x: 0.6
      acc_lim_y: 0.0
      acc_lim_theta: 2.0
      decel_lim_x: -0.8
      decel_lim_y: 0.0
      decel_lim_theta: -2.5
      vx_samples: 16
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.6
      linear_granularity: 0.05
      angular_granularity: 0.025
      # aerial-explore-bench correction (a deviation from the baseline's v9): 1.0 s, the tolerance of the
      # drone's localizer (amcl_aerial.yaml) and of the shared slam_params.yaml (transform_timeout).
      # Isaac stamps /scan, /odom and TF with the Windows clock, Nav2 runs on WSL's (-0.2..+0.5 s
      # apart per run): DWB refused the robot pose when map->odom was 0.42-0.52 s older than the
      # odometry ("Transform data too old" -> FollowPath TF_ERROR 102: 5 of 37 frontier attempts
      # and 3 of 16 tour attempts on world 008). map->odom is a slow correction; 1 s is harmless.
      transform_tolerance: 1.0
      xy_goal_tolerance: 0.35
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.4
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.4
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0   # v7: 0.45->0.30; 0.45 sealed pocket/door mouths
        inflation_radius: 0.30     # for DWB; the body is protected by the inscribed 0.22

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.30   # v8: CONSERVATIVE planner, seals doors <~0.60 on the map
      resolution: 0.05     # (0.22 let NavFn send the 0.42 body into a 0.53 door!)
      track_unknown_space: false
      # v6: NO live obstacle layer on the GLOBAL; walkers got marked permanently at
      # spots the lidar never saw again (no clearing) and sealed corridors after
      # an hour of running. Planning happens on the static map; people are handled
      # by the LOCAL costmap (rolling, with raytrace clearing on every scan).
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.45

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""   # bringup fills this in from the map:= launch argument

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 10.0
    free_thresh_default: 0.196
    occupied_thresh_default: 0.65

docking_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 1
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: false
      use_battery_status: false
      use_stall_detection: false
    # (no 'docks': an empty list crashes the launch; docking is not used)
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.05
      v_linear_max: 0.25

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    # aerial-explore-bench correction: 1.0 s as the controller's (see FollowPath above).
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.3
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.30, 0.0, 1.2]
    # aerial-explore-bench correction (a deviation from the baseline's v9): signed, so 0.0 blocked all
    # reverse - DWB's min_vel_x -0.08 (v8) and the behavior tree's BackUp (0.15 m/s) both pass
    # through this node in Jazzy; in the first batch 234 of 234 backups moved the robot 0 cm.
    min_velocity: [-0.15, 0.0, -1.2]
    max_accel: [0.6, 0.0, 2.0]
    max_decel: [-0.8, 0.0, -2.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.5
    source_timeout: 2.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["CircleStop"]
    CircleStop:
      type: "circle"          # v5: circle instead of square; the 0.28-box corners
      radius: 0.23            # reached 0.40 m and "bit" the jambs at the 0.69 doors
      action_type: "stop"
      min_points: 4
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.0
      max_height: 2.0
      enabled: true
